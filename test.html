<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ECharts 柱状图示例</title>
    <!-- 1. 引入 ECharts 库 (这里使用免费的 jsdelivr CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 2. 为 ECharts 准备一个定义了宽高的 容器 (div) -->
    <div id="main" style="width: 800px; height: 500px; margin: 50px auto; border: 1px solid #eee; padding: 20px;"></div>

    <script type="text/javascript">
        // 3. 基于准备好的 div，初始化 echarts 实例
        var myChart = echarts.init(document.getElementById('main'));

        // 4. 指定图表的配置项和数据
        var option = {
            title: {
                text: '2026年上半年各产品销量',
                subtext: '鼠标放上去可以看具体数值'
            },
            // 【核心功能】tooltip 控制鼠标悬停时的提示框
            tooltip: {
                trigger: 'axis', // 'axis' 表示坐标轴触发，非常适合柱状图和折线图
                axisPointer: {   // 坐标轴指示器配置项
                    type: 'shadow' // 默认为直线，可选为：'line' | 'shadow' (会在柱子背后显示阴影)
                }
            },
            legend: {
                data: ['销量']
            },
            // X 轴配置
            xAxis: {
                type: 'category',
                // 【修改这里】这里是你想要显示在 X 轴底部的一组名称
                data: ['一月', '二月', '三月', '四月', '五月', '六月']
            },
            // Y 轴配置
            yAxis: {
                type: 'value' // 'value' 表示这是数值轴，Y轴的刻度会自动计算
            },
            // 数据系列
            series: [
                {
                    name: '销量',
                    type: 'bar', // 'bar' 代表柱状图
                    // 【修改这里】这里是与 X 轴名称一一对应的具体数值！
                    data: [120, 200, 150, 80, 70, 110],
                    
                    // (可选) 让柱状图变得更好看的额外配置
                    itemStyle: {
                        color: '#5470C6', // 柱子的颜色
                        borderRadius: [5, 5, 0, 0] // 柱子上方的圆角
                    }
                }
            ]
        };

        // 5. 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
